<div class="shell-layout" [class.sidebar-collapsed]="layout.sidebarCollapsed()" [class.is-mobile]="isMobile()">
  @if (isMobile()) {
    @if (!layout.sidebarCollapsed()) {
      <div class="shell-overlay" (click)="layout.toggleSidebar()"></div>
    }
  }
  <aside class="shell-sidebar">
    <app-side-bar [collapsed]="!isMobile() && layout.sidebarCollapsed()" />
  </aside>
  <main class="shell-content">
    <router-outlet></router-outlet>
  </main>
</div>
